services:
  test:
    image: node:24.22.1
    working_dir: /src
    environment:
      - CI=1
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    volumes:
      - .:/src
      - test_node_modules:/src/node_modules
    command: ["sh", "-c", "corepack enable && yarn --immutable && yarn test:watch"]

  test-once:
    image: node:24.22.1
    working_dir: /src
    environment:
      - CI=1
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    volumes:
      - .:/src
      - test_node_modules:/src/node_modules
    command: ["sh", "-c", "corepack enable && yarn --immutable && yarn test:coverage"]

volumes:
  test_node_modules:
