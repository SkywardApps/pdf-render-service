# Dependabot configuration - Security-focused updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Yarn package updates (security-focused)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Limit open PRs to reduce noise
    open-pull-requests-limit: 3
    # Add labels to PRs
    labels:
      - "dependencies"
      - "automated"
    # Rebase strategy
    rebase-strategy: "auto"
    # Commit message prefix
    commit-message:
      prefix: "chore"
      include: "scope"
    # Ignore major version updates to prevent aggressive changes
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Docker updates (pinned to Node 20.x)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Pin to Node 20.x - prevent jumping to Node 21, 22, etc.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Limit major version updates for actions too
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
