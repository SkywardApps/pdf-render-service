# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Minor and patch updates arrive as one grouped PR per ecosystem. Major
# updates are no longer ignored: they arrive in their own grouped PRs
# (dev tooling separate from runtime dependencies) so each can be reviewed
# and tested on its own. Security updates are not grouped.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major-dev:
        dependency-type: "development"
        update-types: ["major"]
      npm-major-prod:
        dependency-type: "production"
        update-types: ["major"]
    ignore:
      # React, its types and react-pdf move together (react-pdf 4 / React 19
      # is a planned migration). Remove these when that work starts.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-pdf/renderer"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node runtime major (see .nvmrc / Dockerfile).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "docker"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Node majors are a deliberate migration: move the Dockerfile,
      # docker-compose.test.yml, .nvmrc, Volta, engines and @types/node
      # together, onto an LTS line.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
