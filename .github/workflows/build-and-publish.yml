name: Build and Publish

on:
  push:
    branches:
      - mainline
      - ci
  pull_request:
    branches:
      - '**'

# A new push to a PR cancels that PR's older run. Pushes to mainline/ci are
# never cancelled, so an in-flight publish always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (Yarn version from package.json)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

  build:
    name: Test, build, and (on mainline) publish
    # Lint must pass before anything is built or published.
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image (runs vitest suite via pdf_test stage)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: pdf_test
          load: true
          tags: pdf-render-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Extract coverage report from test image
        run: |
          CID=$(docker create pdf-render-service:test)
          docker cp "$CID:/src/coverage" ./coverage || true
          docker rm "$CID"

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
          if-no-files-found: warn

      - name: Build release image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: pdf_release
          load: true
          tags: pdf-render-service:release
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Runs before any push, so an image that fails it never publishes.
      - name: Smoke-test release image
        run: bash scripts/smoke-release.sh pdf-render-service:release

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/mainline'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish the exact image the smoke test ran against: tag it and push it,
      # rather than building it a second time.
      - name: Push release image
        if: github.ref == 'refs/heads/mainline'
        env:
          REPO: ghcr.io/skywardapps/pdf-render-service
          SHA: ${{ github.sha }}
        run: |
          docker tag pdf-render-service:release "$REPO:latest"
          docker tag pdf-render-service:release "$REPO:$SHA"
          docker push --all-tags "$REPO"
