name: Build and Publish

on:
  push:
    branches:
      - mainline
      - ci
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Test, build, and (on mainline) publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image (runs vitest suite via pdf_test stage)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: pdf_test
          load: true
          tags: pdf-render-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract coverage report from test image
        run: |
          CID=$(docker create pdf-render-service:test)
          docker cp "$CID:/src/coverage" ./coverage || true
          docker rm "$CID"

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
          if-no-files-found: warn

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/mainline'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: pdf_release
          tags: |
            ghcr.io/skywardapps/pdf-render-service:latest
            ghcr.io/skywardapps/pdf-render-service:${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/mainline' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
